name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'sw.js', 'manifest.webmanifest']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Android project
        run: |
          mkdir app && cd app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          cp ../index.html ../manifest.webmanifest ../sw.js ../icon-*.png www/
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.abdulrahman.chess",
            "appName": "ABDUL RAHMAN CHESS",
            "webDir": "www",
            "backgroundColor": "#0a0a0b"
          }
          EOF
          npx cap add android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-*; do
            cp ../icon-192.png "$d/ic_launcher.png"
            cp ../icon-192.png "$d/ic_launcher_round.png"
          done
          sed -i 's#<activity#<activity android:screenOrientation="portrait"#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: abdul-rahman-chess-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
