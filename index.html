<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">

<title>ABDUL RAHMAN CHESS</title>
<style>
:root{--g:#d4af37;--iv:#f5efe0;--l:#ead9b5;--d:#8a5a2b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:radial-gradient(circle at 50% -10%,#3a2d0e,#0a0a0b 62%) #0a0a0b;color:var(--iv);font-family:Georgia,"Times New Roman",Tahoma,serif;overflow-x:hidden}
.scr{display:none;min-height:100vh;padding:16px;flex-direction:column;align-items:center;gap:11px}
.scr.on{display:flex}
.av{width:128px;height:128px;border-radius:50%;border:3px solid var(--g);box-shadow:0 0 34px #d4af3788;object-fit:cover}
.av.s{width:42px;height:42px;border-width:2px;box-shadow:none}
.logo{font-size:44px;animation:lg 1.4s cubic-bezier(.2,.9,.3,1) both}
@keyframes lg{from{opacity:0;transform:translateY(-30px) scale(.4)}}
h1{font-size:25px;letter-spacing:3px;color:var(--g);text-align:center;direction:ltr}
.sub{font-size:12px;opacity:.8;direction:ltr;text-align:center}
.menu{display:grid;gap:9px;width:100%;max-width:360px;direction:rtl}
button{font:inherit;color:var(--iv);background:linear-gradient(#2d2616,#14110a);border:1px solid var(--g);border-radius:12px;padding:12px;cursor:pointer}
button:active{transform:scale(.97)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
button.pri{background:linear-gradient(#f6e27a,#b8902a);color:#120e04;font-weight:700}
#bw{width:min(94vw,60vh,520px);aspect-ratio:1;position:relative;display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);border:6px solid #4a2f14;border-radius:6px;box-shadow:0 14px 40px #000,0 0 34px #d4af3744;touch-action:none;direction:ltr;user-select:none;container-type:inline-size}
.sq.l{background:var(--l)}.sq.d{background:var(--d)}.sq{position:relative}
.sq.last{box-shadow:inset 0 0 0 100px #f6e27a55}.sq.sel{box-shadow:inset 0 0 20px 7px #ffe36b}.sq.chk{box-shadow:inset 0 0 22px 9px #e22}
.sq.mv::after{content:"";position:absolute;inset:36%;border-radius:50%;background:#12804499}.sq.mv.cp::after{inset:5%;background:none;border:4px solid #128044cc}
.pc{position:absolute;width:12.5%;height:12.5%;display:flex;align-items:center;justify-content:center;font-size:10.4cqw;line-height:1;pointer-events:none;z-index:2;transition:left .3s cubic-bezier(.3,.8,.25,1),top .3s cubic-bezier(.3,.8,.25,1),opacity .3s,transform .3s}
.pc.w{color:#fffaf0;text-shadow:0 0 2px #000,0 0 3px #000,0 3px 3px #0009}
.pc.b{color:#14100a;text-shadow:0 0 2px #f3e3bd,0 1px 2px #fff8,0 3px 3px #0007}
.bar{display:flex;align-items:center;gap:10px;width:min(94vw,60vh,520px);padding:6px 10px;border:1px solid #d4af3744;border-radius:12px;background:#15120a;direction:ltr}
.bar.turn{border-color:var(--g);box-shadow:0 0 14px #d4af3777}
.bar b{display:block;font-size:14px}.bar small{opacity:.7;font-size:11px}.bar i{margin-inline-start:auto;font-style:normal;color:var(--g)}
.ico{width:42px;height:42px;border-radius:50%;border:2px solid var(--g);display:flex;align-items:center;justify-content:center;font-size:22px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#ml{max-width:min(94vw,520px);min-height:30px;line-height:1.5}
#M{display:none;position:fixed;inset:0;background:#000c;align-items:center;justify-content:center;z-index:20;padding:16px}
.box{background:#14110a;border:1px solid var(--g);border-radius:16px;padding:20px;max-width:380px;width:100%;display:grid;gap:10px;box-shadow:0 0 50px #d4af3755;line-height:1.7;max-height:90vh;overflow:auto}
.box h2{color:var(--g);text-align:center}
.st{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:360px}.st div{background:#15120a;border:1px solid #d4af3744;border-radius:10px;padding:10px;text-align:center}
label{display:grid;gap:4px;width:100%;max-width:360px}
.badge{color:#120e04;background:linear-gradient(#f6e27a,#b8902a);padding:4px 14px;border-radius:20px;font-weight:700}
@media(prefers-reduced-motion:reduce){.pc{transition:none}.logo{animation:none}}
</style></head><body>

function ev(s){let v=0;for(let i=0;i<64;i++){const p=s.b[i];if(!p)continue;const l=p.toLowerCase(),r=i>>3,c=i&7,w=isW(p);
const x=V[l]+(l=='p'?(w?7-r:r)*6:l=='k'?0:(7-Math.abs(2*c-7)-Math.abs(2*r-7))*2);v+=w?x:-x}return s.t=='w'?v:-v}
function nm(s,d,a,b){const ms=legal(s);if(!ms.length)return inCheck(s)?-1e5-d:0;if(!d)return ev(s);
ms.sort((x,y)=>(s.b[y.t]?1:0)-(s.b[x.t]?1:0));
for(const m of ms){const v=-nm(ap(s,m),d-1,-b,-a);if(v>=b)return b;if(v>a)a=v}return a}
function best(s,lv){const ms=legal(s);if(lv==0||Math.random()<[0,.35,.12,0,0,0][lv])return ms[Math.random()*ms.length|0];
const d=[0,1,1,2,3,4][lv];let bv=-1e9,bm=ms[0];
for(const m of ms){const v=-nm(ap(s,m),d-1,-1e9,1e9)+Math.random()*(lv<3?30:3);if(v>bv){bv=v;bm=m}}return bm}
/* ===== الصوت ===== */
let AC,sv=.7,mvol=.25,mute=0,inG=0;
const ac=()=>AC||(AC=new(window.AudioContext||window.webkitAudioContext)());
function tn(f,d,t='sine',v=.3,dl=0,f2,mu){try{const a=ac(),o=a.createOscillator(),g=a.createGain(),s=a.currentTime+dl;o.type=t;o.frequency.setValueAtTime(f,s);
if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d);g.gain.setValueAtTime(Math.max(1e-4,v*(mu?mvol:sv)*(mute?0:1)),s);
g.gain.exponentialRampToValueAtTime(1e-4,s+d);o.connect(g).connect(a.destination);o.start(s);o.stop(s+d+.02)}catch(e){}}
function snd(k,p){p=(p||'').toLowerCase();
if(k=='sel')tn(900,.04,'sine',.2);
else if(k=='mv'){if(p=='n'){tn(200,.06,'triangle',.5,0,90);tn(240,.06,'triangle',.4,.08,110)}
else if(p=='r')tn(120,.14,'triangle',.6,0,60);else if(p=='b')tn(320,.12,'sawtooth',.08,0,200);
else if(p=='k'||p=='q'){tn(220,.1,'triangle',.5,0,100);tn(660,.25,'sine',.12,.04)}else tn(190,.07,'triangle',.5,0,90)}
else if(k=='cap'){tn(150,.16,'square',.2,0,50);tn(90,.2,'triangle',.5)}
else if(k=='chk'){tn(880,.12,'square',.12,.1);tn(660,.2,'square',.1,.22)}
else if(k=='mate'){[392,330,262,196].forEach((f,i)=>tn(f,.35,'sawtooth',.14,i*.18))}
else if(k=='win')[523,659,784,1047].forEach((f,i)=>tn(f,.4,'triangle',.3,i*.14));
else if(k=='lose')[392,311,262].forEach((f,i)=>tn(f,.45,'sine',.25,i*.2));
else if(k=='promo')[392,523,659,784].forEach((f,i)=>tn(f,.2,'sine',.25,i*.08));
else tn(330,.4,'sine',.2)}
setTimeout(function mus(){const sc=[220,261.6,329.6,392,440];
if(inG&&!mute&&mvol>0){tn(sc[Math.random()*5|0],2.6,'sine',.5,0,0,1);tn(sc[Math.random()*5|0]/2,3,'sine',.4,.5,0,1)}
setTimeout(mus,S&&S.b.filter(x=>x).length<=10?1300:2600)},500);
document.addEventListener('pointerdown',()=>{try{ac().resume()}catch(e){}});
/* ===== حالة اللعبة ===== */
let S,els,sel=null,last=null,hist=[],mode='cpu',lv=2,busy=0,over=0,human='w',st={g:0,w:0,l:0,d:0,e:1200};
try{Object.assign(st,JSON.parse(localStorage.getItem('arc')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('arc',JSON.stringify(st))}catch(e){}};
function show(id){document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id==id));inG=id=='g';M.style.display='none'}
const modal=h=>{M.innerHTML='<div class="box">'+h+'</div>';M.style.display='flex'};
const closeM=()=>M.style.display='none';
const soon=n=>modal(`<h2>${n}</h2><div>يحتاج هذا القسم خادماً وقاعدة بيانات، وسيُضاف في المرحلة القادمة.</div><button onclick="closeM()">حسناً</button>`);
const lvls=()=>modal('<h2>اختر المستوى</h2>'+LV.map((n,i)=>`<button onclick="startGame('cpu',${i})">${n}</button>`).join('')+'<button onclick="closeM()">إلغاء</button>');
const learn=()=>modal(`<h2>تعلّم الشطرنج</h2><div>• الجندي يتقدم خطوة (خطوتين في أول حركة) ويأكل بالقطر.<br>• الحصان يقفز على شكل حرف L.<br>• الفيل بالقطر، والقلعة بالخط المستقيم، والملكة تجمعهما.<br>• الملك خطوة واحدة في أي اتجاه.<br>• كش: الملك مهدد، يجب إنقاذه فوراً. كش مات: لا مخرج، وتنتهي المباراة.<br>• التبييت: الملك والقلعة معاً إن لم يتحركا ولا يوجد تهديد في الطريق.<br>• الترقية: الجندي الواصل لآخر الرقعة يصبح ملكة.<br>• الأخذ بالتجاوز: يأكل الجندي جندياً تقدم خطوتين وجاور له مباشرة.</div><button onclick="closeM()">فهمت</button>`);
function prof(){$('#stt').innerHTML=`<div>المباريات<br><b>${st.g}</b></div><div>التصنيف ELO<br><b>${st.e}</b></div><div>الانتصارات<br><b>${st.w}</b></div><div>الخسائر<br><b>${st.l}</b></div><div>التعادلات<br><b>${st.d}</b></div><div>الميدالية<br><b>${st.w>=10?'🥇':st.w>=3?'🥈':st.w>=1?'🥉':'—'}</b></div>`;show('p')}
function startGame(m,l){mode=m;lv=l;human='w';S=start();sel=null;last=null;hist=[];over=0;busy=0;
$('#oi').textContent=m=='cpu'?'🤖':'♚';$('#tn').textContent=m=='cpu'?'الكمبيوتر':'اللاعب الثاني (أسود)';
$('#tc').textContent=m=='cpu'?'المستوى: '+LV[l]:'على نفس الجهاز';
$('#bn').textContent=m=='cpu'?'ABDUL RAHMAN 👑':'اللاعب الأول (أبيض)';
show('g');bd.innerHTML='';els=Array(64).fill(null);
for(let i=0;i<64;i++){const q=document.createElement('div');q.className='sq';bd.append(q)}
S.b.forEach((p,i)=>{if(p){els[i]=mk(p,i)}});paint();ui()}
function mk(p,i){const e=document.createElement('div');e.className='pc '+(isW(p)?'w':'b');e.textContent=G[p.toLowerCase()];place(e,i);bd.append(e);return e}
const place=(e,i)=>{e.style.left=(i&7)*12.5+'%';e.style.top=(i>>3)*12.5+'%'};
function paint(){const q=bd.children;for(let i=0;i<64;i++)q[i].className='sq '+(((i>>3)+(i&7))%2?'d':'l');
if(last){q[last.f].classList.add('last');q[last.t].classList.add('last')}
if(sel!=null){q[sel].classList.add('sel');for(const m of legal(S))if(m.f==sel){const c=q[m.t].classList;c.add('mv');if(S.b[m.t]||m.ep)c.add('cp')}}
if(inCheck(S))q[S.b.indexOf(S.t=='w'?'K':'k')].classList.add('chk')}
function ui(){const cw=S.b.filter(p=>p&&isW(p)).length,cb=S.b.filter(p=>p&&!isW(p)).length,wt=S.t=='w';
$('#top').classList.toggle('turn',!wt);$('#bot').classList.toggle('turn',wt);
$('#t1').textContent=(wt?'':'● دوره  ')+cb+' قطعة';$('#t2').textContent=(wt?'● دورك  ':'')+cw+' قطعة';
$('#ml').textContent=hist.map((h,i)=>(i%2?'':(i/2+1|0)+'. ')+h).slice(-10).join('  ')}
const pick=(f,t)=>legal(S).find(m=>m.f==f&&m.t==t&&(!m.p||m.p.toLowerCase()=='q'));
function mv(m){busy=1;const p=S.b[m.f],w=S.t=='w',vi=m.ep?m.t+(w?8:-8):m.t,cap=S.b[vi],el=els[m.f],ve=els[vi];
if(ve){ve.style.opacity=0;ve.style.transform='scale(.4) rotate(40deg)';setTimeout(()=>ve.remove(),320);els[vi]=null}
if(m.cas){const k=m.t>m.f,rf=k?m.f+3:m.f-4,rt=k?m.f+1:m.f-1;els[rt]=els[rf];els[rf]=null;place(els[rt],rt)}
els[m.f]=null;els[m.t]=el;place(el,m.t);if(m.p)setTimeout(()=>el.textContent=G[m.p.toLowerCase()],150);
hist.push(sqn(m.f)+(cap?'×':'-')+sqn(m.t)+(m.p?'=Q':''));last=m;sel=null;S=ap(S,m);
const L=legal(S),ck=inCheck(S);
setTimeout(()=>{snd(cap?'cap':'mv',p);if(m.p)snd('promo');else if(ck&&L.length)snd('chk')},240);
paint();ui();
setTimeout(()=>{busy=0;if(!L.length)finish(ck?'mate':'stale',ck?(w?'w':'b'):null);else if(mode=='cpu'&&S.t!=human)cpu()},340)}
function cpu(){busy=1;ui();setTimeout(()=>{if(over)return;busy=0;mv(best(S,lv))},80)}
function finish(k,win){if(over)return;over=1;busy=0;st.g++;let t;
if(!win){st.d++;t='🤝 تعادل';snd('lose')}
else{const hw=mode=='fr'||win==human;if(mode=='cpu'){if(hw){st.w++;st.e+=10+lv*3}else{st.l++;st.e=Math.max(100,st.e-8)}}
t=(k=='mate'?'كش مات! ':k=='resign'?'استسلام. ':'')+(mode=='cpu'?(hw?'🏆 مبروك، فزت!':'خسرت هذه المرة'):'فاز '+(win=='w'?'الأبيض':'الأسود'));
snd(k=='mate'?'mate':'win');if(hw)setTimeout(()=>snd('win'),700)}
save();setTimeout(()=>modal(`<h2>${t}</h2><button class="pri" onclick="startGame(mode,lv)">مباراة جديدة</button><button onclick="show('h')">القائمة الرئيسية</button>`),500)}
const resign=()=>{if(over)return;finish('resign',mode=='cpu'?(human=='w'?'b':'w'):(S.t=='w'?'b':'w'))};
function drawB(){if(over)return;if(mode=='cpu'&&ev({...S,t:human=='w'?'b':'w'})>40)return modal('<h2>رفض الكمبيوتر التعادل</h2><button onclick="closeM()">حسناً</button>');finish('draw',null)}
/* ===== الإدخال: نقر وسحب وإفلات ===== */
const at=e=>{const r=bd.getBoundingClientRect(),c=Math.floor((e.clientX-r.left)/r.width*8),w=Math.floor((e.clientY-r.top)/r.height*8);return c<0||c>7||w<0||w>7?-1:w*8+c};
let drag=null;
bd.onpointerdown=e=>{if(busy||over)return;const i=at(e);if(i<0)return;
if(sel!=null){const m=pick(sel,i);if(m){mv(m);return}}
const p=S.b[i];if(p&&isW(p)==(S.t=='w')&&(mode=='fr'||S.t==human)){sel=i;snd('sel');paint();drag={i,x:e.clientX,y:e.clientY,on:0};bd.setPointerCapture(e.pointerId)}else{sel=null;paint()}};
bd.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y,el=els[drag.i];
if(!drag.on&&Math.hypot(dx,dy)>8){drag.on=1;el.style.transition='none';el.style.zIndex=9}
if(drag.on)el.style.transform=`translate(${dx}px,${dy}px) scale(1.15)`};
bd.onpointerup=e=>{if(!drag)return;const d=drag;drag=null;if(!d.on)return;const el=els[d.i],t=at(e),m=t>=0&&t!=d.i&&pick(d.i,t);
el.style.zIndex='';if(m){el.style.transition='none';el.style.transform='';place(el,t);void el.offsetWidth;el.style.transition='';mv(m)}
else{el.style.transition='';el.style.transform=''}};
</script></body></html>
